name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-javascript:
    name: ci
    if: >-
      ${{
        github.event_name != 'push' ||
        (
          !contains(github.event.head_commit.message, '[skip ci]') &&
          !contains(github.event.head_commit.message, '[ci skip]')
        )
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v4

      - name: Setup Project
        id: setup-project
        uses: ./.github/actions/setup-project

      - name: Build dist
        id: npm-package
        run: pnpm run build

      - name: Check Format
        id: npm-format-check
        run: pnpm run format

      - name: Lint
        id: npm-lint
        run: pnpm run lint

      - name: Test
        id: npm-ci-test
        run: pnpm run ci-test

  test-action:
    name: ci / action
    if: >-
      ${{
        github.event_name != 'push' ||
        (
          !contains(github.event.head_commit.message, '[skip ci]') &&
          !contains(github.event.head_commit.message, '[ci skip]')
        )
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v4

      - name: Setup Project
        id: setup-project
        uses: ./.github/actions/setup-project

      - name: Build dist
        id: npm-package
        run: pnpm run build

      - name: Create Turbo test double
        run: |
          mkdir -p "${RUNNER_TEMP}/turbo-bin"
          cat > "${RUNNER_TEMP}/turbo-bin/turbo" <<'EOF'
          #!/usr/bin/env node
          const packages = process.argv.includes('--affected')
            ? []
            : [{ name: 'turbo-affected' }];
          process.stdout.write(JSON.stringify({ packages: { items: packages } }));
          EOF
          chmod +x "${RUNNER_TEMP}/turbo-bin/turbo"

      - name: Test Local Action
        id: test-action
        uses: ./
        with:
          base: HEAD
          workspaces: turbo-affected
          turbo-path: ${{ runner.temp }}/turbo-bin/turbo

      - name: Verify local action outputs
        run: |
          test '${{ steps.test-action.outputs.affected }}' = '{"turbo-affected":false}'
          test '${{ steps.test-action.outputs.affected-workspaces }}' = '[]'
          test '${{ steps.test-action.outputs.any-affected }}' = 'false'
